# The exported app's one command, from this folder: docker compose up --build (see README.md).
# Generated by the builder from one object (builder/src/export/app-compose.ts) and held to it by a test:
# not to be edited by hand. The build engine may not change it.
networks:
  data:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "isolated"
  front:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "isolated"
  edge:
    enable_ipv6: false
volumes:
  keys: {}
  dbdata: {}
services:
  keys:
    image: "node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: "1g"
    read_only: true
    network_mode: "none"
    entrypoint: []
    volumes:
      -
        type: "volume"
        source: "keys"
        target: "/keys"
    command:
      - "node"
      - "-e"
      - "const fs=require('fs'),c=require('crypto');for(const[n,b,p]of[['db_password',18,''],['auth_secret',32,''],['sample_password',12,'Sample-']]){const f='/keys/'+n;if(fs.existsSync(f)){console.log('kept '+n);continue}fs.rmSync(f+'.tmp',{force:true});fs.writeFileSync(f+'.tmp',p+c.randomBytes(b).toString('base64url'),{mode: 0o444});fs.renameSync(f+'.tmp',f);console.log('made '+n)}"
  db:
    image: "postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: "1g"
    cap_add:
      - "CHOWN"
      - "DAC_OVERRIDE"
      - "FOWNER"
      - "SETGID"
      - "SETUID"
    read_only: false
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD_FILE: "/run/secrets/db_password"
      POSTGRES_DB: "app"
    volumes:
      -
        type: "volume"
        source: "dbdata"
        target: "/var/lib/postgresql/data"
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/db_password"
        read_only: true
        volume:
          subpath: "db_password"
    networks:
      - "data"
    depends_on:
      keys:
        condition: "service_completed_successfully"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -h 127.0.0.1 -p 5432 -U app -d app"
      interval: "2s"
      retries: 30
  setup:
    build:
      context: "."
      target: "tools"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: "1g"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-3000}"
    volumes:
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/db_password"
        read_only: true
        volume:
          subpath: "db_password"
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/auth_secret"
        read_only: true
        volume:
          subpath: "auth_secret"
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/sample_password"
        read_only: true
        volume:
          subpath: "sample_password"
    networks:
      - "data"
    depends_on:
      db:
        condition: "service_healthy"
    command:
      - "sh"
      - "-c"
      - "set -eu; db=$$(cat /run/secrets/db_password); as=$$(cat /run/secrets/auth_secret); sp=$$(cat /run/secrets/sample_password); export DATABASE_URL=\"postgres://app:$$db@db:5432/app\" AUTH_SECRET=\"$$as\" APP_SAMPLE_PASSWORD=\"$$sp\"; node_modules/.bin/drizzle-kit migrate; exec node --import tsx scripts/seed.ts"
  app:
    build:
      context: "."
      target: "run"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: "1g"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
      - "/app/.next/cache:rw,nosuid,size=128m"
    environment:
      PORT: "3000"
      APP_URL: "http://localhost:${APP_PORT:-3000}"
    volumes:
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/db_password"
        read_only: true
        volume:
          subpath: "db_password"
      -
        type: "volume"
        source: "keys"
        target: "/run/secrets/auth_secret"
        read_only: true
        volume:
          subpath: "auth_secret"
    networks:
      - "data"
      - "front"
    depends_on:
      setup:
        condition: "service_completed_successfully"
    entrypoint: []
    command:
      - "sh"
      - "-c"
      - "set -eu; db=$$(cat /run/secrets/db_password); as=$$(cat /run/secrets/auth_secret); export DATABASE_URL=\"postgres://app:$$db@db:5432/app\" AUTH_SECRET=\"$$as\"; exec node server.js"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null http://127.0.0.1:3000/en/sign-in || exit 1"
      interval: "3s"
      retries: 40
      start_period: "10s"
  door:
    image: "node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: "1g"
    read_only: true
    user: "node"
    entrypoint: []
    networks:
      - "front"
      - "edge"
    ports:
      -
        target: 3000
        published: "${APP_PORT:-3000}"
        host_ip: "127.0.0.1"
        protocol: "tcp"
    depends_on:
      app:
        condition: "service_healthy"
    command:
      - "node"
      - "-e"
      - "const n=require('net');n.createServer((c)=>{const s=n.connect(3000,'app');c.pipe(s);s.pipe(c);s.on('error',()=>c.destroy());c.on('error',()=>s.destroy())}).listen(3000,'0.0.0.0')"
